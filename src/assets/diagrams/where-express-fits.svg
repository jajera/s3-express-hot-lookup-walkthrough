<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="410" viewBox="0 0 780 410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b7b"/>
    </marker>
    <style>
      .lbl { font-size: 12px; font-weight: 600; fill: #232f3e; text-anchor: middle; }
      .sub { font-size: 10.5px; fill: #5a6b7b; text-anchor: middle; }
      .edge { stroke: #5a6b7b; stroke-width: 2; fill: none; }
      .edgelbl { font-size: 10.5px; fill: #5a6b7b; text-anchor: middle; }
      .title { font-size: 14px; font-weight: 700; fill: #232f3e; }
      .grp { font-size: 12px; font-weight: 700; }
      .grpsub { font-size: 10.5px; fill: #5a6b7b; }
      .legend { font-size: 10.5px; fill: #5a6b7b; }
    </style>
  </defs>

  <!-- self-contained light surface so the diagram reads on any page theme -->
  <rect id="s3x-surface" x="0.5" y="0.5" width="779" height="409" rx="10" fill="#ffffff" stroke="#d6dde5" stroke-width="1"/>

  <text x="24" y="32" class="title">Express is single-AZ</text>
  <text x="24" y="50" class="grpsub" fill="#c0392b">Never leave the only copy of important data in Express.</text>

  <!-- Application (left) -->

  <g>
    <image x="64.0" y="180" width="52" height="52" href="data:image/svg+xml;base64,"/>
    <text x="90" y="248" class="lbl">Application</text>
    <text x="90" y="262" class="sub">reads + rebuilds</text>
  </g>

  <!-- Region container (right) -->
  <rect x="300" y="56" width="440" height="320" rx="8" fill="none" stroke="#00A4A6" stroke-width="2"/>
  <image x="308" y="64" width="24" height="24" href="data:image/svg+xml;base64,"/>
  <text x="340" y="82" class="grp" fill="#007f80">Region ap-southeast-2</text>

  <!-- Multi-AZ Standard copy (top row) -->

  <g>
    <image x="404.0" y="96" width="52" height="52" href="data:image/svg+xml;base64,"/>
    <text x="430" y="164" class="lbl">Standard / source</text>
    <text x="430" y="178" class="sub">multi-AZ, authoritative</text>
  </g>

  <!-- AZ failure-domain box (bottom) with the directory bucket -->
  <rect x="330" y="196" width="380" height="156" rx="6" fill="#fbecea" stroke="#c0392b" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="344" y="216" class="grp" fill="#c0392b">AZ apse2-az1 &#183; failure domain</text>

  <g>
    <image x="404.0" y="228" width="52" height="52" href="data:image/svg+xml;base64,"/>
    <text x="430" y="296" class="lbl">Directory bucket</text>
    <text x="430" y="310" class="sub">Express One Zone</text>
  </g>
  <text x="520.0" y="342" class="edgelbl" fill="#c0392b">&#9888; AZ-wide event can lose these objects</text>

  <!-- edges (all short, non-crossing) -->
  <!-- app -> Standard (authoritative / rebuild), upper -->
<line x1="118" y1="188" x2="400" y2="130" class="edge" marker-end="url(#arrow)"/>
  <rect x="171.0" y="117" width="148" height="16" rx="3" fill="#ffffff" opacity="0.92"/><text x="245" y="128" class="edgelbl">authoritative / rebuild</text>

  <!-- app -> Express (hot GETs), lower -->
<line x1="118" y1="210" x2="324" y2="254" class="edge" marker-end="url(#arrow)"/>
  <rect x="201.0" y="221" width="78" height="16" rx="3" fill="#ffffff" opacity="0.92"/><text x="240" y="232" class="edgelbl">hot GETs</text>

  <!-- Standard -> Express re-seed: dashed elbow that leaves the Standard icon's
       right edge, drops down the RESEED_X gutter, and enters the directory
       bucket's right edge. RESEED_X sits right of both sub-labels. -->
<path d="M 454 122.0 H 620 V 254.0 H 458"
        class="edge" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)"/>
  <rect x="572.0" y="163" width="96" height="16" rx="3" fill="#ffffff" opacity="0.92"/><text x="620" y="174" class="edgelbl">copy / re-seed</text>

  <!-- legend -->
  <line x1="24" y1="398" x2="54" y2="398" class="edge"/>
  <text x="60" y="402" class="legend">runtime read</text>
  <line x1="188" y1="398" x2="218" y2="398" class="edge" stroke-dasharray="6 5"/>
  <text x="224" y="402" class="legend">re-seed from the durable copy</text>
</svg>
