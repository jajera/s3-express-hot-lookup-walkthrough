version: 0.2

# Builds the lab harness image and pushes it to ECR.
# Source zip root must contain this file plus Dockerfile, app.py, dash.html, requirements.txt
# (see scripts/image.sh build).

env:
  variables:
    IMAGE_REPO_NAME: "s3x-hotlookup-harness"

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR…"
      - ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - REPOSITORY_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}"
      - aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - IMAGE_TAG="${IMAGE_TAG:-latest}"
      - echo "REPOSITORY_URI=${REPOSITORY_URI} IMAGE_TAG=${IMAGE_TAG}"
  build:
    commands:
      - echo "Building harness image…"
      - docker build -t "${REPOSITORY_URI}:${IMAGE_TAG}" -t "${REPOSITORY_URI}:latest" .
  post_build:
    commands:
      - echo "Pushing ${REPOSITORY_URI}:${IMAGE_TAG} and :latest"
      - docker push "${REPOSITORY_URI}:${IMAGE_TAG}"
      - docker push "${REPOSITORY_URI}:latest"
      - printf '{"imageUri":"%s"}\n' "${REPOSITORY_URI}:${IMAGE_TAG}" > imageDetail.json

artifacts:
  files:
    - imageDetail.json
